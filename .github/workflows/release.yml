name: HyprTools CI and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test Workspace
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  release:
    name: Build and Publish Release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build \
            --release \
            --locked \
            --workspace

      - name: Prepare release binaries
        run: |
          mkdir -p dist

          cp target/release/rofi-search \
             dist/rofi-search-linux-x86_64-gnu

          cp target/release/brightness-control \
             dist/brightness-control-linux-x86_64-gnu

          strip dist/rofi-search-linux-x86_64-gnu
          strip dist/brightness-control-linux-x86_64-gnu

      - name: Verify binaries
        run: |
          for binary in dist/*; do
            file "$binary"
            test -x "$binary"
          done

          echo "All release binaries are ready."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/rofi-search-linux-x86_64-gnu
            dist/brightness-control-linux-x86_64-gnu
